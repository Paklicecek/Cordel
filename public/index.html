<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cordel</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="login.js"></script>
</head>
<body>
  <header>

  </header>
  <main>
    <img src="img/logo.png" alt="Logo missing - reload the page" class="logo">
    <h1>Cordel</h1>
    <p>Live chatting application</p>
    <div class="container">
      <h2>Welcome back</h2>
      <p>Sign in to your account or create a new one</p>

      <div class="backgroundOption">
        <p>Login</p>
        <p>Sign Up</p>
      </div>

      <h3>Username</h3>
      <input type="text" name="username" id="usernameInput" placeholder="Paklicek">

      <h3>Password</h4>
      <input type="password" name="password" id="passwordInput" placeholder="Enter Your Password">

      <div class="passwordContainer">
        <input type="checkbox" name="remember">
        <p>Remember me</p>
        <a href="">Forgot Password?</a>
      </div>

      <input type="submit" name="" id="" value="Sign In">
      <!-- add or continue with google (gmail) -->
    </div>
    <p class="tos">By continuing you agree with TOS</p>

  </main>
  <footer>

  </footer>
</body>
</html>
