<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cordel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/login.js" defer></script>
</head>
<body>
  <main>
    <div class="header-content">
        <img src="img/logo.png" alt="Cordel Logo" class="logo">
        <h1>Cordel</h1>
        <p id="slug">Live chatting application</p>
    </div>

    <div class="container">
      <h2><span id="formTitle">Welcome Back</span></h2>
      <p class="subtitle">Sign in to your account or create a new one</p>

      <div class="backgroundOption">
        <div class="glider"></div>
        <button class="toggle-btn active" id="loginBtn" type="button">Login</button>
        <button class="toggle-btn" id="signupBtn" type="button">Sign up</button>
      </div>

      <form action="" method="post" id="form" class="form">
          <div class="input-group">
            <label for="usernameInput">Username</label>
            <input type="text" name="username" id="usernameInput" placeholder="Enter your username">
          </div>

          <div class="input-group">
            <label for="passwordInput">Password</label>
            <input type="password" name="password" id="passwordInput" placeholder="Enter your password">
          </div>

          <div class="passwordContainer">
            <label class="checkbox-container">
                <input type="checkbox" name="remember" class="checkbox">
                <span>Remember me</span>
            </label>
          </div>

          <input type="submit" value="Sign In" class="sign-in-btn" id="submitBtn">
      </form>
    </div>
    <p id="tos">By continuing, you agree with the TOS</p>

  </main>

</body>
</html>
